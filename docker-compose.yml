services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-redchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_local}
      POSTGRES_DB: ${DB_NAME:-redchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend_network]

  redis:
    image: redis:7-alpine
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend_network]

  back:
    build: ./back
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgres://${DB_USER:-redchat}:${DB_PASSWORD:-change_me_local}@db:5432/${DB_NAME:-redchat}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - uploads_data:/app/uploads
    networks: [backend_network]

  front:
    build: ./front
    environment:
      NODE_ENV: production
    depends_on: [back]
    networks: [frontend_network]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [front, back]
    networks: [frontend_network, backend_network]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    depends_on: [back]
    networks: [backend_network]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  uploads_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge
